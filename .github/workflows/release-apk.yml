name: Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Serialize rather than cancel: two concurrent runs would read the same version from
# gradle.properties and both try to release it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # shallow clones hide tags, and the already-released check needs them

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Read the version
        id: version
        run: |
          # gradle.properties is the only place the version is set; F-Droid's checkupdates
          # reads the same lines at each tag. A manual dispatch refuses to re-release a
          # version already tagged, so a forgotten bump fails here instead of overwriting
          # nothing and confusing later. An ordinary push to main only *might* carry a
          # bump, so it skips instead of failing — that keeps routine merges green.
          VERSION=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Cannot parse VERSION_NAME: '$VERSION'" >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::notice::v$VERSION is already released; skipping (bump VERSION_NAME and VERSION_CODE in gradle.properties to cut a new one)."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "v$VERSION is already released. Bump VERSION_NAME and VERSION_CODE in gradle.properties first." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Prepare signing keystore
        if: steps.version.outputs.release == 'true'
        # Through env, not ${{ }}: interpolation splices the secret's *value* into the
        # shell source, so a password containing $ or a backtick would be expanded.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/tmsmeasurement-release.jks
            {
              echo "storeFile=keystore/tmsmeasurement-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
          fi

      - name: Build signed release APK
        if: steps.version.outputs.release == 'true'
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage the APK under a stable filename
        if: steps.version.outputs.release == 'true'
        run: |
          # A fixed name is what makes releases/latest/download/TMSMeasurement.apk work.
          cp app/build/outputs/apk/release/app-release.apk TMSMeasurement.apk
          ls -la TMSMeasurement.apk

      - name: Verify the APK is signed
        if: steps.version.outputs.release == 'true'
        run: |
          # The check that proves what we are about to publish, rather than inferring
          # it from a green build — an unsigned APK stages under the same filename as
          # a signed one, and this also catches a key password that doesn't match the
          # store password.
          APKSIGNER=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found in the Android SDK" >&2; exit 1; }
          "$APKSIGNER" verify --print-certs TMSMeasurement.apk

      - name: Remove keystore from the runner
        if: always() && steps.version.outputs.release == 'true'
        run: rm -f keystore/tmsmeasurement-release.jks keystore.properties

      # This step creates the tag as well as the release. Pushing the tag ourselves
      # first would mean a failure here left the tag behind with no release attached,
      # and the next run would compute the following version — burning that number
      # for good. main is branch-protected, so nothing in this workflow pushes to it;
      # this is the only ref it writes.
      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Without this the tag lands on whatever the default branch points at when
          # the API call runs, which is not necessarily the commit whose APK is
          # attached.
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: TMSMeasurement.apk
