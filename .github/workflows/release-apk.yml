name: Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump (patch, minor, major)"
        required: false
        default: "patch"
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

# Serialize rather than cancel: the next version is derived from the newest tag, so
# two concurrent runs would both read the same one and try to release the same
# version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # shallow clones hide tags, and the version comes from them

      - name: Set up JDK 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Compute next version
        id: version
        run: |
          # --sort=-version:refname, because a lexical sort puts v0.9.0 above v0.10.0.
          LATEST=$(git tag --list 'v*' --sort=-version:refname | head -1)
          [ -z "$LATEST" ] && LATEST="v0.0.0"
          VERSION="${LATEST#v}"
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "Cannot parse tag: $LATEST"; exit 1; }
          MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
          case "${{ inputs.release_type }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            *) PATCH=$((PATCH+1)) ;;
          esac
          echo "version=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "tag=v$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"

      - name: Prepare signing keystore
        # Through env, not ${{ }}: interpolation splices the secret's *value* into the
        # shell source, so a password containing $ or a backtick would be expanded.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/tmsmeasurement-release.jks
            {
              echo "storeFile=keystore/tmsmeasurement-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
          fi

      - name: Build signed release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage the APK under a stable filename
        run: |
          # A fixed name is what makes releases/latest/download/TMSMeasurement.apk work.
          cp app/build/outputs/apk/release/app-release.apk TMSMeasurement.apk
          ls -la TMSMeasurement.apk

      - name: Verify the APK is signed
        run: |
          # The check that proves what we are about to publish, rather than inferring
          # it from a green build — an unsigned APK stages under the same filename as
          # a signed one, and this also catches a key password that doesn't match the
          # store password.
          APKSIGNER=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found in the Android SDK" >&2; exit 1; }
          "$APKSIGNER" verify --print-certs TMSMeasurement.apk

      - name: Remove keystore from the runner
        if: always()
        run: rm -f keystore/tmsmeasurement-release.jks keystore.properties

      # This step creates the tag as well as the release. Pushing the tag ourselves
      # first would mean a failure here left the tag behind with no release attached,
      # and the next run would compute the following version — burning that number
      # for good. main is branch-protected, so nothing in this workflow pushes to it;
      # this is the only ref it writes.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Without this the tag lands on whatever the default branch points at when
          # the API call runs, which is not necessarily the commit whose APK is
          # attached.
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: TMSMeasurement.apk
